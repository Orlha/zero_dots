# Primary Font Config (matching your exact fc-list output)
font_family      FiraCode Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        14
modify_font cell_height 105%
background_opacity 0.825
dynamic_background_opacity yes
shell /usr/bin/zsh
cursor #42afcc
cursor_text_color #101010
cursor_blink_interval 0

map ctrl+alt+s launch --stdin-source=@last_cmd_output --type=clipboard
map ctrl+alt+w kitten hints --type=word --program @
map ctrl+alt+l kitten hints --type=line --program @
map ctrl+alt+p kitten hints --type=path --program @
cursor_shape underline
cursor_underline_thickness 0.8
shell_integration no-cursor

color5 #d14780
color8 #4d4d4d
color13 #f06292

map ctrl+alt+1 goto_tab 1
map ctrl+alt+2 goto_tab 2
map ctrl+alt+3 goto_tab 3
map ctrl+alt+4 goto_tab 4
map ctrl+alt+5 goto_tab 5
map ctrl+alt+6 goto_tab 6
map ctrl+alt+7 goto_tab 7
map ctrl+alt+8 goto_tab 8
map ctrl+alt+9 goto_tab 9

tab_bar_style powerline
#tab_powerline_style round
tab_bar_edge left
#tab_bar_min_tabs 1
active_tab_font_style   bold

active_tab_foreground   #000000
active_tab_background   #A6E3A1
inactive_tab_foreground #CDD6F4
inactive_tab_background #1E1E2E

tab_bar_background    #11111B
tab_bar_margin_color  #11111B

tab_bar_margin_width  0.0
tab_bar_margin_height 0.0 0.0

tab_title_template "   {index}: {title[:20]}"
active_tab_title_template " ● {index}: {title[:20]}"

active_tab_foreground   #11111B
active_tab_background   #89B4FA   # blue - softer than mint, classic accent
inactive_tab_foreground #A6ADC8   # subtext0 - muted, not full-bright text
inactive_tab_background #313244   # surface0 - visible against bar bg

tab_bar_background      #181825   # mantle - slightly lifted from base
tab_bar_margin_color    #181825
#tab_title_max_length 16
#tab_bar_style hidden

enable_audio_bell no
