# Primary Font Config (matching your exact fc-list output)
 font_family      FiraCode Nerd Font
 bold_font        auto
 italic_font      auto
 bold_italic_font auto
font_size        17
#modify_font cell_height 105%
modify_font cell_height 100%
background_opacity 0.775
dynamic_background_opacity yes
shell /usr/bin/zsh
#text_composition_strategy legacy
#cursor #ff8800
#cursor #4b0082
#cursor #d300ff
#cursor #8b00ff
#cursor #00ffcc
cursor #42afcc
cursor_text_color #1e1e2e
cursor_blink_interval 0
#shell_integration no
#shell_integration no-title

map ctrl+shift+s launch --stdin-source=@last_cmd_output --type=clipboard
map ctrl+shift+w kitten hints --type=word --program @
map ctrl+shift+l kitten hints --type=line --program @
map ctrl+shift+p kitten hints --type=path --program @
cursor_shape underline
cursor_underline_thickness 0.8
shell_integration no-cursor
disable_ligatures always
#color8 #707880

color8 #4d4d4d
#color5 #ff007f
#color13 #ff2a8a

#color5 #e6006f
#color13 #ff4097

color5 #d14780
color13 #f06292
